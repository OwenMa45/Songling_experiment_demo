[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-titration"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2", "PyYAML>=6", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]
simulation = ["mujoco>=3.2,<4", "imageio>=2.34", "imageio-ffmpeg>=0.5"]

[project.scripts]
piper-titration = "piper_titration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
